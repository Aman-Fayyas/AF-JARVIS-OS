name: Build AF JARVIS OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Debian 13 amd64 ISO build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out AF JARVIS OS
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          uname -a
          df -h
          free -h

      - name: Install Debian bootstrap tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap rsync

      - name: Create Debian 13 amd64 build environment
        run: |
          sudo mkdir -p /opt/af-jarvis-debian
          sudo debootstrap --arch=amd64 trixie /opt/af-jarvis-debian http://deb.debian.org/debian
          sudo mount --bind /dev /opt/af-jarvis-debian/dev
          sudo mount --bind /dev/pts /opt/af-jarvis-debian/dev/pts
          sudo mount -t proc proc /opt/af-jarvis-debian/proc
          sudo mount -t sysfs sys /opt/af-jarvis-debian/sys
          sudo cp /etc/resolv.conf /opt/af-jarvis-debian/etc/resolv.conf

      - name: Copy source into Debian environment
        run: |
          sudo mkdir -p /opt/af-jarvis-debian/work/AF-JARVIS-OS
          sudo rsync -a --delete --exclude .git ./ /opt/af-jarvis-debian/work/AF-JARVIS-OS/

      - name: Enable Debian firmware repositories
        run: |
          sudo tee /opt/af-jarvis-debian/etc/apt/sources.list >/dev/null <<'EOF'
          deb http://deb.debian.org/debian trixie main contrib non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free-firmware
          deb http://security.debian.org/debian-security trixie-security main contrib non-free-firmware
          EOF

      - name: Install AF JARVIS OS build dependencies
        run: |
          sudo chroot /opt/af-jarvis-debian /bin/bash -lc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              live-build debootstrap squashfs-tools xorriso isolinux syslinux-common \
              grub-pc-bin grub-efi-amd64-bin mtools dosfstools rsync ripgrep \
              openssl python3
          '

      - name: Run project preflight inside Debian 13
        run: |
          sudo chroot /opt/af-jarvis-debian /bin/bash -lc '
            cd /work/AF-JARVIS-OS
            python3 scripts/build-preflight.py --mount
          '

      - name: Build AF JARVIS OS ISO
        run: |
          sudo chroot /opt/af-jarvis-debian /bin/bash -lc '
            set -euo pipefail
            cd /work/AF-JARVIS-OS
            umask 077
            HASH_FILE=/tmp/af-jarvis-ci-password.hash
            install -m 600 /dev/null "$HASH_FILE"
            openssl passwd -6 "jarvis-ci-live" > "$HASH_FILE"
            chmod 600 "$HASH_FILE"
            export JARVIS_LIVE_PASSWORD_HASH_FILE="$HASH_FILE"
            bash scripts/build-iso.sh --build /work/AF-JARVIS-OS/build/github-actions
            rm -f "$HASH_FILE"
          '

      - name: Show build outputs
        if: always()
        run: |
          sudo find /opt/af-jarvis-debian/work/AF-JARVIS-OS -maxdepth 3 -type f \
            \( -name '*.iso' -o -name '*.sha256' -o -name '*.log' \) -print || true
          df -h

      - name: Copy ISO artifacts out of chroot
        run: |
          sudo mkdir -p "$GITHUB_WORKSPACE/artifacts"
          sudo find /opt/af-jarvis-debian/work/AF-JARVIS-OS -type f \
            \( -name 'AF-JARVIS-OS-v0.1-alpha.iso' -o -name 'AF-JARVIS-OS-v0.1-alpha.iso.sha256' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE/artifacts"
          test -f "$GITHUB_WORKSPACE/artifacts/AF-JARVIS-OS-v0.1-alpha.iso"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AF-JARVIS-OS-v0.1-alpha
          path: |
            artifacts/AF-JARVIS-OS-v0.1-alpha.iso
            artifacts/AF-JARVIS-OS-v0.1-alpha.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Unmount Debian environment
        if: always()
        run: |
          sudo umount -l /opt/af-jarvis-debian/dev/pts 2>/dev/null || true
          sudo umount -l /opt/af-jarvis-debian/dev 2>/dev/null || true
          sudo umount -l /opt/af-jarvis-debian/proc 2>/dev/null || true
          sudo umount -l /opt/af-jarvis-debian/sys 2>/dev/null || true
