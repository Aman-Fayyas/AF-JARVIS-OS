name: AF JARVIS Phase 3 - Normal Login QEMU

on:
  workflow_dispatch:
  push:
    branches:
      - minimal-hardware-validation

permissions:
  contents: read

jobs:
  normal-login:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Install host and display-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap rsync qemu-system-x86 ovmf socat xvfb xdotool imagemagick tesseract-ocr sshpass openssl python3-venv espeak-ng curl unzip

      - name: Create isolated Debian 13 builder
        run: |
          sudo mkdir -p /opt/af-jarvis-debian
          sudo debootstrap --arch=amd64 trixie /opt/af-jarvis-debian http://deb.debian.org/debian
          sudo mount --bind /dev /opt/af-jarvis-debian/dev
          sudo mount --bind /dev/pts /opt/af-jarvis-debian/dev/pts
          sudo mount -t proc proc /opt/af-jarvis-debian/proc
          sudo mount -t sysfs sys /opt/af-jarvis-debian/sys
          sudo cp /etc/resolv.conf /opt/af-jarvis-debian/etc/resolv.conf
          sudo mkdir -p /opt/af-jarvis-debian/work/AF-JARVIS-OS
          sudo rsync -a --delete --exclude .git ./ /opt/af-jarvis-debian/work/AF-JARVIS-OS/
          sudo tee /opt/af-jarvis-debian/etc/apt/sources.list >/dev/null <<'EOF'
          deb http://deb.debian.org/debian trixie main contrib non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free-firmware
          deb http://security.debian.org/debian-security trixie-security main contrib non-free-firmware
          EOF

      - name: Prepare ephemeral CI login credentials
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf 'AF_JARVIS_CI_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          printf '%s' "$password" | openssl passwd -6 -stdin > "$RUNNER_TEMP/af-jarvis-ci-password.hash"
          chmod 600 "$RUNNER_TEMP/af-jarvis-ci-password.hash"
          sudo install -D -m 600 "$RUNNER_TEMP/af-jarvis-ci-password.hash" /opt/af-jarvis-debian/tmp/af-jarvis-ci-password.hash

      - name: Install image build dependencies and build ISO
        run: |
          set -euo pipefail
          sudo chroot /opt/af-jarvis-debian /bin/bash /work/AF-JARVIS-OS/scripts/ci-prepare-normal-login.sh
          sudo cp /opt/af-jarvis-debian/work/AF-JARVIS-OS/build/qemu-normal-login/AF-JARVIS-OS-v0.1-alpha.iso .
          sudo chown "$USER:$USER" AF-JARVIS-OS-v0.1-alpha.iso
          sha256sum AF-JARVIS-OS-v0.1-alpha.iso | tee AF-JARVIS-normal-login-iso.sha256
          rm -f "$RUNNER_TEMP/af-jarvis-ci-password.hash"

      - name: Validate BIOS normal login
        id: bios
        timeout-minutes: 35
        continue-on-error: true
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/ci-normal-login-qemu.sh bios AF-JARVIS-OS-v0.1-alpha.iso "$AF_JARVIS_CI_PASSWORD" "$RUNNER_TEMP/af-jarvis-bios"

      - name: Validate UEFI normal login
        id: uefi
        timeout-minutes: 35
        continue-on-error: true
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/ci-normal-login-qemu.sh uefi AF-JARVIS-OS-v0.1-alpha.iso "$AF_JARVIS_CI_PASSWORD" "$RUNNER_TEMP/af-jarvis-uefi"

      - name: Validate offline Vosk recognition with generated speech
        if: steps.bios.outcome == 'success' && steps.uefi.outcome == 'success'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vosk-venv"
          "$RUNNER_TEMP/vosk-venv/bin/python" -m pip install --disable-pip-version-check --no-input vosk==0.3.45
          curl -fL --retry 3 --connect-timeout 15 "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" -o "$RUNNER_TEMP/vosk-model.zip"
          unzip -q "$RUNNER_TEMP/vosk-model.zip" -d "$RUNNER_TEMP"
          espeak-ng -v en-us -s 135 -w "$RUNNER_TEMP/vosk-test.wav" "Offline recognition check"
          "$RUNNER_TEMP/vosk-venv/bin/python" - "$RUNNER_TEMP/vosk-test.wav" "$RUNNER_TEMP/vosk-model-small-en-us-0.15" "$RUNNER_TEMP/vosk-result.json" <<'PY'
          import json, sys, wave
          from vosk import Model, KaldiRecognizer
          wav_path, model_path, out_path = sys.argv[1:]
          with wave.open(wav_path, "rb") as wav:
              assert wav.getnchannels() == 1
              assert wav.getsampwidth() == 2
              rate = wav.getframerate()
              audio = wav.readframes(wav.getnframes())
          model = Model(model_path)
          recognizer = KaldiRecognizer(model, rate)
          recognizer.AcceptWaveform(audio)
          result = json.loads(recognizer.FinalResult())
          text = result.get("text", "").lower()
          assert text.strip(), f"Vosk returned an empty transcription for non-empty speech input"
          report = {"status": "passed", "mode": "offline", "input": "eSpeak-generated mono PCM WAV", "sample_rate": rate, "recognized_text": text, "physical_microphone": "not tested in hosted CI"}
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          PY

      - name: Report firmware validation outcomes
        if: always()
        run: |
          echo "BIOS outcome: ${{ steps.bios.outcome }}"
          echo "UEFI outcome: ${{ steps.uefi.outcome }}"
          test "${{ steps.bios.outcome }}" = success
          test "${{ steps.uefi.outcome }}" = success

      - name: Upload normal-login evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AF-JARVIS-Phase3-normal-login-evidence
          path: |
            ${{ runner.temp }}/af-jarvis-bios/
            ${{ runner.temp }}/af-jarvis-uefi/
            AF-JARVIS-normal-login-iso.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup builder mounts
        if: always()
        run: |
          sudo umount -l /opt/af-jarvis-debian/dev/pts 2>/dev/null || true
          sudo umount -l /opt/af-jarvis-debian/dev 2>/dev/null || true
          sudo umount -l /opt/af-jarvis-debian/proc 2>/dev/null || true
          sudo umount -l /opt/af-jarvis-debian/sys 2>/dev/null || true
